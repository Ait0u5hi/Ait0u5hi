<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Noah, Ait0u5hi - AI-agent infrastructure, ML tooling, evals and CI/CD">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="46%">
      <stop offset="0" stop-color="#101f33"/>
      <stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8ad7ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <!-- one barbed sigil wing (right side); thin, spiky, tapering to points -->
    <g id="wing" fill="none" stroke-linecap="round">
      <g stroke="url(#sig)" stroke-opacity="0.28" stroke-width="5">
        <path d="M770 140 C 872 128, 930 104, 1004 112 C 1074 120, 1100 154, 1160 142"/>
      </g>
      <g stroke="#dff3ff" stroke-width="1.4">
        <path d="M770 140 C 872 128, 930 104, 1004 112 C 1074 120, 1100 154, 1160 142"/>
        <path d="M778 148 C 858 160, 916 176, 992 166 C 1044 159, 1074 148, 1128 158"/>
      </g>
      <!-- sharp thorns: thin filled needles -->
      <g fill="url(#sig)">
        <path d="M872 105 L866 74 L879 104 Z"/>
        <path d="M930 104 L940 72 L945 103 Z"/>
        <path d="M1004 112 L1020 80 L1013 114 Z"/>
        <path d="M1074 120 L1092 92 L1083 122 Z"/>
        <path d="M916 176 L906 208 L928 180 Z"/>
        <path d="M992 166 L982 200 L1004 170 Z"/>
        <path d="M1074 148 L1092 176 L1064 152 Z"/>
      </g>
      <!-- tapering tip flourish -->
      <g stroke="url(#sig)" stroke-width="1.3">
        <path d="M1160 142 l40 -8 M1160 142 l34 16 M1160 142 l20 -26"/>
      </g>
      <g fill="#8ad7ff">
        <circle cx="1150" cy="120" r="2.2"/>
        <circle cx="1030" cy="94" r="1.6"/>
        <circle cx="1108" cy="182" r="1.6"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="280" fill="url(#halo)"/>

  <use href="#wing"/>
  <use href="#wing" transform="translate(1200,0) scale(-1,1)"/>

  <!-- central sigil glyph -->
  <g stroke="url(#sig)" fill="none" stroke-width="1.7" stroke-linecap="round">
    <circle cx="600" cy="74" r="14" stroke-opacity="0.85"/>
    <path d="M600 52 L600 96 M584 64 L616 64 M588 86 L612 86"/>
    <path d="M600 52 l-13 -13 M600 52 l13 -13"/>
  </g>

  <!-- kicker -->
  <text x="600" y="128" text-anchor="middle" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="15" letter-spacing="9" fill="#38e0f0">A I T 0 U 5 H I</text>

  <!-- name -->
  <text x="600" y="194" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="70" letter-spacing="16" fill="#e9f7ff" stroke="url(#sig)" stroke-width="0.8">NOAH</text>

  <!-- tagline -->
  <text x="600" y="234" text-anchor="middle" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="13.5" letter-spacing="4" fill="#8aa0c6">AI-AGENT INFRASTRUCTURE &#8226; ML TOOLING &#8226; EVALS &amp; CI/CD</text>
</svg>
