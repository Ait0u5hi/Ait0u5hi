name: Metrics
on:
  schedule: [{ cron: "0 8 * * *" }]      # daily refresh
  workflow_dispatch:                      # manual trigger for the first run
  push: { branches: ["main", "profile-revamp"] }
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # pinned to metrics v3.34 (commit 6583672)
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ait0u5hi
          filename: github-metrics.svg
          template: terminal
          config_timezone: America/Chicago
          base: header, activity, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 5
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: "pre { background: transparent !important; color: #6e7681 !important } .header, .buttons { display: none !important } .isocalendar svg { filter: none !important } .banner, footer { color: #6e7681 !important } b, strong { color: #6e7681 !important } .ps1-path { color: #2ea043 !important } .ps1-location { color: #4493f8 !important } @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } } footer::after { content: ' ▋'; color: #2ea043 !important; animation: blink 1.06s steps(1) infinite } @keyframes fadein { from { opacity: 0 } to { opacity: 1 } } .stdout { max-height: none !important; opacity: 0; animation-name: fadein !important; animation-fill-mode: both !important } .stdin { animation-duration: 0.32s !important } .stdout { animation-duration: 0.56s !important } .stdin:nth-of-type(1) { animation-delay: 0.0s !important } .stdin:nth-of-type(2) { animation-delay: 0.88s !important } .stdin:nth-of-type(3) { animation-delay: 1.76s !important } .stdin:nth-of-type(4) { animation-delay: 2.64s !important } .stdin:nth-of-type(5) { animation-delay: 3.52s !important } .stdin:nth-of-type(6) { animation-delay: 4.4s !important } .stdin:nth-of-type(7) { animation-delay: 5.28s !important } .stdin:nth-of-type(8) { animation-delay: 6.16s !important } .stdin:nth-of-type(9) { animation-delay: 7.04s !important } .stdout:nth-of-type(2) { animation-delay: 0.32s !important } .stdout:nth-of-type(3) { animation-delay: 1.2s !important } .stdout:nth-of-type(4) { animation-delay: 2.08s !important } .stdout:nth-of-type(5) { animation-delay: 2.96s !important } .stdout:nth-of-type(6) { animation-delay: 3.84s !important } .stdout:nth-of-type(7) { animation-delay: 4.72s !important } .stdout:nth-of-type(8) { animation-delay: 5.6s !important } .stdout:nth-of-type(9) { animation-delay: 6.48s !important } .stdout:nth-of-type(10) { animation-delay: 7.36s !important } footer { animation-delay: 7.04s !important }"
