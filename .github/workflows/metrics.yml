name: Metrics
on:
  schedule: [{ cron: "0 8 * * *" }]      # daily refresh
  workflow_dispatch:                      # manual trigger for the first run
  push: { branches: ["main", "profile-revamp"] }
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # pinned to metrics v3.34 (commit 6583672)
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ait0u5hi
          filename: github-metrics.svg
          template: terminal
          config_timezone: America/Chicago
          base: header, activity, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 5
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: "pre { background: transparent !important; color: #6e7681 !important } .header, .buttons { display: none !important } .isocalendar svg { filter: none !important } .banner, footer { color: #6e7681 !important } b, strong { color: #6e7681 !important } .ps1-path { color: #2ea043 !important } .ps1-location { color: #4493f8 !important } .stdin { animation-duration: 0.35s !important } .stdout { animation-duration: 0.62s !important } .stdin:nth-of-type(1) { animation-delay: 0.0s !important } .stdin:nth-of-type(2) { animation-delay: 0.97s !important } .stdin:nth-of-type(3) { animation-delay: 1.94s !important } .stdin:nth-of-type(4) { animation-delay: 2.9s !important } .stdin:nth-of-type(5) { animation-delay: 3.87s !important } .stdin:nth-of-type(6) { animation-delay: 4.84s !important } .stdin:nth-of-type(7) { animation-delay: 5.81s !important } .stdin:nth-of-type(8) { animation-delay: 6.78s !important } .stdin:nth-of-type(9) { animation-delay: 7.74s !important } .stdout:nth-of-type(2) { animation-delay: 0.35s !important } .stdout:nth-of-type(3) { animation-delay: 1.32s !important } .stdout:nth-of-type(4) { animation-delay: 2.29s !important } .stdout:nth-of-type(5) { animation-delay: 3.26s !important } .stdout:nth-of-type(6) { animation-delay: 4.22s !important } .stdout:nth-of-type(7) { animation-delay: 5.19s !important } .stdout:nth-of-type(8) { animation-delay: 6.16s !important } .stdout:nth-of-type(9) { animation-delay: 7.13s !important } .stdout:nth-of-type(10) { animation-delay: 8.1s !important } footer { animation-delay: 7.74s !important }"
