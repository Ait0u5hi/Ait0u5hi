name: Terminal Card
on:
  schedule: [{ cron: "0 8 * * *" }]      # daily refresh
  workflow_dispatch:
  push: { branches: ["main"], paths: ["render_terminal.py", ".github/workflows/terminal-card.yml"] }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Render terminal stat cards (dark + light)
        env:
          GH_USER: Ait0u5hi
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}   # classic PAT (GraphQL)
        run: python render_terminal.py
      - name: Rasterize cards to PNG
        # SVG served from raw.githubusercontent as text/plain proxies unreliably
        # through GitHub's image cache; PNG (like the header) renders every time.
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2
          pip install cairosvg
          cairosvg github-terminal-dark.svg  -o github-terminal-dark.png  -s 2
          cairosvg github-terminal-light.svg -o github-terminal-light.png -s 2
      - name: Commit updated cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-terminal-dark.svg github-terminal-light.svg \
                  github-terminal-dark.png github-terminal-light.png
          git diff --cached --quiet || git commit -m "Update terminal cards [skip ci]"
          git push
